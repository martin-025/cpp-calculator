name: Scorecard supply-chain security
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run scorecard analysis"
        uses: ossf/scorecard-action@63b9a8d6724458f310f881d77b85e05417fc9959 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@b4ffde65f46336ab88eb53be808477a3936bac11 # v4.4.3
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@f60eb47f9b92f446a2757270e5b7b41eeb095690 # v3.28.10
        with:
          sarif_file: results.sarif
