name: Scorecard supply-chain security
on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  # Triggers weekly on Mondays at 01:30 UTC
  schedule:
    - cron: '30 1 * * 1'
  # Triggers on pushes to main
  push:
    branches: [ "main" ]

# Declare default permissions as read-only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to GitHub's code scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to write security alerts
      contents: read
      actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Run scorecard analysis"
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          # Set publish_results: true to enable badge and public results reporting
          publish_results: true

      # Upload the results to GitHub's Code Scanning dashboard (Security tab)
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the SARIF results to GitHub Code Scanning
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
